<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flask Frontend — Index</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="top-header">
      <div class="container header-inner">
        <div class="header-date-wrap">
          <span class="header-label">Today</span>
          <span id="dateTab" class="header-date"></span>
        </div>
        <div class="header-actions">
          <a id="googleConnectBtn" href="/google/connect" class="google-connect-btn" hidden>
            Connect Google Calendar
          </a>
          <button id="addEventBtn" type="button" class="add-event-btn">
            <svg
              width="14"
              height="14"
              viewBox="0 0 16 16"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8 3v10M3 8h10"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            Add event
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <h2 class="section-label">Upcoming events</h2>
        <p id="appMessage" class="app-message" role="status" aria-live="polite" hidden></p>

        <div class="events-panel">
          <ul id="eventsList" aria-live="polite" class="events-root-list"></ul>

          <div id="emptyState" class="empty-state">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M3 7a1 1 0 011-1h1V5a3 3 0 013-3h6a3 3 0 013 3v1h1a1 1 0 011 1v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"
                stroke="#9CA3AF"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M8 11h8M8 15h5"
                stroke="#9CA3AF"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <p>No events scheduled.</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Fullscreen modal for adding events -->
    <div id="eventModal" class="modal" aria-hidden="true">
      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <header class="modal-header">
          <h3 id="modalTitle">Add event</h3>
          <div class="modal-header-actions">
            <button id="saveEventBtn" class="btn primary" type="button">
              Save
            </button>
            <button id="closeModal" class="modal-close" aria-label="Close">
              ✕
            </button>
          </div>
        </header>

        <form id="eventForm" class="modal-body">
          <label class="field">
            <span class="label">Title</span>
            <input id="eventTitle" type="text" maxlength="140" required />
          </label>

          <label class="field">
            <span class="label">Date</span>
            <div class="picker-input-wrap">
              <input
                id="eventDate"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="MM/DD/YYYY"
                required
              />
              <button
                type="button"
                class="picker-open-btn"
                data-picker-target="date"
                aria-label="Open date selector"
              >
                Select
              </button>
            </div>
          </label>

          <label class="field">
            <span class="label">Start time</span>
            <div class="picker-input-wrap">
              <input
                id="eventTime"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="h:mm AM/PM"
                required
              />
              <button
                type="button"
                class="picker-open-btn"
                data-picker-target="start-time"
                aria-label="Open start time selector"
              >
                Select
              </button>
            </div>
          </label>

          <label class="field">
            <span class="label">End time</span>
            <div class="picker-input-wrap">
              <input
                id="eventEndTime"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="h:mm AM/PM"
                required
              />
              <button
                type="button"
                class="picker-open-btn"
                data-picker-target="end-time"
                aria-label="Open end time selector"
              >
                Select
              </button>
            </div>
          </label>

        </form>
      </div>
    </div>

    <div id="wheelPicker" class="wheel-picker" hidden aria-hidden="true">
      <div id="wheelBackdrop" class="wheel-backdrop"></div>
      <div class="wheel-sheet" role="dialog" aria-modal="true" aria-labelledby="wheelPickerTitle">
        <div class="wheel-toolbar">
          <button id="wheelCancelBtn" type="button" class="wheel-btn">Cancel</button>
          <div id="wheelPickerTitle" class="wheel-title">Select</div>
          <button id="wheelDoneBtn" type="button" class="wheel-btn wheel-btn--done">Done</button>
        </div>
        <div id="wheelColumns" class="wheel-columns"></div>
        <div class="wheel-selection-row" aria-hidden="true"></div>
      </div>
    </div>

    <script src="/static/js/main.js"></script>
  </body>
</html>
