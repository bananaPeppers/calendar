<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samip's Calendar</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="top-header">
      <div class="container header-inner">
        <div class="header-date-wrap">
          <span class="header-label">Today</span>
          <span id="dateTab" class="header-date"></span>
        </div>
        <div class="header-actions">
          <a
            id="googleConnectBtn"
            href="/google/connect"
            class="google-connect-btn"
            aria-label="Sign in with Google"
            title="Sign in with Google"
            hidden
          >
            <img src="/static/images/google-g.svg" alt="" aria-hidden="true" />
          </a>
          <button
            id="googleDisconnectBtn"
            type="button"
            class="google-disconnect-btn"
            aria-label="Disconnect Google Calendar"
            title="Disconnect Google Calendar"
            hidden
          >
            <img src="/static/images/logout.svg" alt="" />
          </button>
          <button id="addEventBtn" type="button" class="add-event-btn">
            <svg
              width="14"
              height="14"
              viewBox="0 0 16 16"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8 3v10M3 8h10"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            Add event
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <h2 class="section-label">Upcoming events</h2>
        <p
          id="appMessage"
          class="app-message"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <div class="events-panel">
          <ul id="eventsList" aria-live="polite" class="events-root-list"></ul>

          <div id="emptyState" class="empty-state">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M3 7a1 1 0 011-1h1V5a3 3 0 013-3h6a3 3 0 013 3v1h1a1 1 0 011 1v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"
                stroke="#9CA3AF"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M8 11h8M8 15h5"
                stroke="#9CA3AF"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <p>No events scheduled.</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Fullscreen modal for adding events -->
    <div id="eventModal" class="modal" aria-hidden="true">
      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Add event"
      >
        <header class="modal-header">
          <input
            id="eventTitle"
            class="modal-title-input"
            type="text"
            maxlength="140"
            placeholder="Event title"
          />
          <div class="modal-header-actions">
            <button id="saveEventBtn" class="btn primary" type="button">
              Save
            </button>
            <button id="closeModal" class="modal-close" aria-label="Close">
              ✕
            </button>
          </div>
        </header>

        <form id="eventForm" class="modal-body">
          <div class="field">
            <span class="label">Date</span>
            <input
              id="eventDate"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="MM/DD/YYYY"
              required
            />
            <div
              id="miniCalendar"
              class="mini-calendar"
              aria-label="Mini calendar"
            >
              <div class="mini-cal-header">
                <button
                  id="miniCalPrev"
                  type="button"
                  class="mini-cal-nav"
                  aria-label="Previous month"
                >
                  &#8249;
                </button>
                <span id="miniCalMonthLabel" class="mini-cal-month"
                  >Month Year</span
                >
                <button
                  id="miniCalNext"
                  type="button"
                  class="mini-cal-nav"
                  aria-label="Next month"
                >
                  &#8250;
                </button>
              </div>
              <div class="mini-cal-weekdays" aria-hidden="true">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span
                ><span>Thu</span><span>Fri</span><span>Sat</span>
              </div>
              <div
                id="miniCalGrid"
                class="mini-cal-grid"
                role="grid"
                aria-label="Select date"
              ></div>
            </div>
          </div>

          <input id="eventTime" type="hidden" />
          <input id="eventEndTime" type="hidden" />

          <div id="timeDial" class="time-dial" aria-label="Time dial">
            <div id="timeDialRing" class="time-dial-ring">
              <button
                id="timeDialStartHandle"
                type="button"
                class="time-dial-handle is-start"
                aria-label="Adjust start time"
              ></button>
              <button
                id="timeDialEndHandle"
                type="button"
                class="time-dial-handle is-end"
                aria-label="Adjust end time"
              ></button>

              <div class="time-dial-center">
                <div class="time-dial-center-row">
                  <span class="time-dial-center-label is-start">Start</span>
                  <span id="timeDialStartText" class="time-dial-center-time"
                    >--</span
                  >
                </div>
                <div id="timeDialEndRow" class="time-dial-center-row">
                  <span class="time-dial-center-label is-end">End</span>
                  <span id="timeDialEndText" class="time-dial-center-time"
                    >--</span
                  >
                </div>
              </div>
            </div>
            <p id="timeDialDuration" class="time-dial-duration"></p>
            <div
              id="modalConflictMessage"
              class="modal-conflict-message"
              role="alert"
              aria-live="assertive"
              hidden
            >
              <span class="modal-conflict-icon" aria-hidden="true">!</span>
              <span class="modal-conflict-text"></span>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div id="wheelPicker" class="wheel-picker" hidden aria-hidden="true">
      <div id="wheelBackdrop" class="wheel-backdrop"></div>
      <div
        class="wheel-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="wheelPickerTitle"
      >
        <div class="wheel-toolbar">
          <button id="wheelCancelBtn" type="button" class="wheel-btn">
            Cancel
          </button>
          <div id="wheelPickerTitle" class="wheel-title">Select</div>
          <button
            id="wheelDoneBtn"
            type="button"
            class="wheel-btn wheel-btn--done"
          >
            Done
          </button>
        </div>
        <div id="wheelColumns" class="wheel-columns"></div>
        <div class="wheel-selection-row" aria-hidden="true"></div>
      </div>
    </div>

    <script src="/static/js/main.js"></script>
  </body>
</html>
